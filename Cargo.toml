[package]
name = "picofeedr"
version = "0.5.0-alpha.1"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
feed-rs = "1"
hex = "0.4"
regex = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2", features = ["derive"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
sha1 = "0.10"
shellexpand = "3"
base64 = "0.22"
crossbeam-channel = "0.5"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
ureq = { version = "3.3", features = ["rustls"] }
time = { version = "0.3", features = ["local-offset", "macros", "parsing"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "tag_query_complex"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = "z"
